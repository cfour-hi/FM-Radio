name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # 版本从 package.json 的 packageManager 字段读
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # 不联网：只校验仓库里已提交的三份快照结构
      - run: pnpm data:validate

      - run: pnpm test

      - run: pnpm build

  e2e:
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # @playwright/test 尚未写入 lockfile（创建时的环境无法访问 npm）。
      # 先在这里临时安装；本地执行过 pnpm add -D 后应改为普通 devDependency。
      - run: pnpm add -D @playwright/test@^1

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm e2e
