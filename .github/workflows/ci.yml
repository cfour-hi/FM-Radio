name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # 快照按 manifest 哈希缓存；命中后 data:pull 只做本地校验
      - uses: actions/cache@v6
        with:
          path: src/data
          key: fm-data-v1-${{ hashFiles('data/manifest.json') }}

      # 版本从 package.json 的 packageManager 字段读
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 快照现在挂在 release 上；manifest 与本地文件一致时这一步是空操作
      - run: pnpm data:pull
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm typecheck

      # 不联网：只校验本地三份快照的结构
      - run: pnpm data:validate

      - run: pnpm test

      - run: pnpm build

  e2e:
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: src/data
          key: fm-data-v1-${{ hashFiles('data/manifest.json') }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm data:pull
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm e2e
